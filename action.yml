name: POCP verify
description: Re-runs a pull request's required tests on the code being merged, and holds edits to existing tests for a maintainer.
branding:
  icon: check-circle
  color: green
inputs:
  range:
    description: "Commit range to verify. Defaults to the pull request's base..head. Required on any event that isn't a pull request (for a push, for example: the event's before..after shas)."
    required: false
    default: ''
  rerun:
    description: "Re-run mode: all (verify runs every required check itself; the default), unsigned (skip proofs signed by a key in .proof/allowed_signers), or none."
    required: false
    default: 'all'
  ci-results:
    description: "Faster, trusting mode. Path to a results file written by `pocp ci-run` earlier in the job; checks with a passing result for the same code and command aren't re-run. This trusts everything that ran in the job before verify: a new test in the pull request can append a passing result for any check. Leave empty (the default) to re-run every check."
    required: false
    default: ''
  accept-policy-change:
    description: "'true' only when a maintainer approved loosening .proof/ rules or signers (for example with a label), or the head commit's sha that approval was given for: a sha approves only that head, never a later push."
    required: false
    default: 'false'
  accept-test-change:
    description: "'true' only when a maintainer approved changes to existing tests or test setup (separate from policy approval), or the head commit's sha that approval was given for: a sha approves only that head, never a later push."
    required: false
    default: 'false'
  accept-inconclusive:
    description: "'true' or the head commit's sha, only when a maintainer approved a test change whose check didn't finish (timed out, killed). A test approval doesn't cover that. A sha approves only that head."
    required: false
    default: 'false'
  accept-uncovered:
    description: "'true' or the head commit's sha, only when a maintainer approved the commits .proof/exceptions.json lists as having no proof. A sha approves only that head."
    required: false
    default: 'false'
  exit-detail:
    description: "'true' to also report verify's result as the `code` output: 0 verified, 4 only an approval is missing, 5 something didn't finish, anything else a failure. The step still fails on anything but verified, so give it `continue-on-error: true` and use the verified / waiting / inconclusive / failed steps in examples/github/pocp.yml. Only the step's outcome means verified: the code may only choose between waiting, inconclusive and failed (without isolation, the checks share the job's user and could write to the output file). (Up to v1.0.0 the step passed with exit-detail; a workflow written for that still never turns a failure green, but shows a wait as a failure until it is updated.) 'false' (the default): no code output."
    required: false
    default: 'false'
  isolate:
    description: "'true' (the default, the secure profile): run every check verify re-runs as a fresh unprivileged Linux user that can't reach the verifier, this job's files and tokens, or verify's processes. Needs a Linux runner with passwordless sudo (GitHub-hosted Ubuntu runners have it); if isolation can't be set up, the step fails rather than run checks as the job's user. Toolchains must be installed outside $HOME (setup-node and the other setup actions are). 'false': the cooperative runner, checks run as the job's user (not a security boundary; see docs/THREAT-MODEL.md)."
    required: false
    default: 'true'
  install:
    description: "Command that installs dependencies (for example: npm ci), run isolated at the pull request's head before the checks. The folders .proof/config.json's snapshot.link names (node_modules by default) are then sealed read-only and linked into every check. Needs isolate. Don't install dependencies in an earlier step: that runs the pull request's install scripts as the job's user."
    required: false
    default: ''
  require-coverage:
    description: Fail commits whose changed files needed a packet but had none.
    required: false
    default: 'true'
  label-freshness:
    description: "'github' (examples/github/pocp.yml): an approval counts only if its label was applied by someone with write access after this head first ran, and after the latest force-push, or it carries over to a clean merge of the base (\"Update branch\"). verify asks GitHub's API, with github-token, so the job needs `actions: read` and `pull-requests: read`. Empty (the default, for workflows written before v1.3.1): the label is taken as given, and pocp-labels.yml must remove approvals on push."
    required: false
    default: ''
  github-token:
    description: "With label-freshness: a token that reads the pull request's events and Actions runs (github.token). Only verify's own process gets it, and it takes it out of its environment before anything runs; no check ever sees it."
    required: false
    default: ${{ github.token }}
  pocp-command:
    description: "Command to run pocp with, instead of the copy bundled with this action (for example: node verifier/bin/pocp.js). It is split into words on whitespace, without shell expansion (no quotes, globs or variables). The bundled copy is pinned by the ref you use the action at (uses: harriswekselblatt/pocp@<commit>)."
    required: false
    default: ''
outputs:
  code:
    description: "verify's exit code, with exit-detail: 4 waiting for approval, 5 inconclusive, anything else failed. Not proof of verified: only the step's outcome is."
    value: ${{ steps.verify.outputs.code }}
  needs:
    description: "The approval labels verify waits for, comma-separated (empty when it waits for none). For the pocp status's text only: a line printed during the step can also set it. approvable_needs is the list that decides."
    value: ${{ steps.verify.outputs.needs }}
  approvable:
    description: "'true' when verify waits for approvals only and `approvable_needs` lists every one, so those labels, all given, make the pocp status green without running verify again (the approvable step in examples/github/pocp.yml). Only with isolate 'true' and the bundled pocp: verify writes it to a file in the runner's temp folder, which isolated checks can't reach, and a separate step reads it, so nothing printed during verify can set it. Otherwise empty."
    value: ${{ steps.mark.outputs.approvable }}
  approvable_needs:
    description: "With approvable: the labels the wait needs, from the same file (comma-separated)."
    value: ${{ steps.mark.outputs.needs }}
  held_tests:
    description: "What an approval of this head binds to (sticky approvals, docs/REFERENCE.md): the fingerprint of the set of files verify held as test changes. Only with isolate 'true' and the bundled pocp, from a file isolated checks can't reach; otherwise empty. The workflow names a step after it (`pocp-held tests <fingerprint>`) for the trusted reporter."
    value: ${{ steps.records.outputs.held_tests }}
  approval_tests:
    description: "For a pocp-approve-tests label given for an earlier head: '<verdict> <that head>', where verdict is same (this head is exactly that head plus base content), content, conflict, ci, policy or gone. Same source as held_tests; empty when not compared."
    value: ${{ steps.records.outputs.approval_tests }}
  approval_policy:
    description: "As approval_tests, for pocp-approve-policy."
    value: ${{ steps.records.outputs.approval_policy }}
  approvable_verdict:
    description: "With approvable: what the test guard found (behavior-changed, detection-dropped, baseline-red or needs-review), from the same file, for the pocp status's words only. Empty when verify wrote none."
    value: ${{ steps.mark.outputs.verdict }}
runs:
  using: composite
  steps:
    - name: Verify
      id: verify
      shell: bash
      env:
        RANGE_INPUT: ${{ inputs.range }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        EVENT_NAME: ${{ github.event_name }}
        RERUN: ${{ inputs.rerun }}
        CI_RESULTS: ${{ inputs.ci-results }}
        ACCEPT_POLICY: ${{ inputs.accept-policy-change }}
        ACCEPT_TESTS: ${{ inputs.accept-test-change }}
        ACCEPT_INCONCLUSIVE: ${{ inputs.accept-inconclusive }}
        ACCEPT_UNCOVERED: ${{ inputs.accept-uncovered }}
        EXIT_DETAIL: ${{ inputs.exit-detail }}
        COVERAGE: ${{ inputs.require-coverage }}
        ISOLATE: ${{ inputs.isolate }}
        INSTALL: ${{ inputs.install }}
        POCP_CMD: ${{ inputs.pocp-command }}
        LABEL_FRESHNESS: ${{ inputs.label-freshness }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        POCP_GITHUB_TOKEN: ${{ inputs.label-freshness == 'github' && inputs.github-token || '' }}
        APPROVAL_FILE: ${{ runner.temp }}/pocp-approvable
        RECORD_FILE: ${{ runner.temp }}/pocp-records
      run: |
        rm -f "$APPROVAL_FILE"
        rm -f "$RECORD_FILE"
        if [ -n "$RANGE_INPUT" ]; then RANGE=$RANGE_INPUT
        elif [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ]; then RANGE="$PR_BASE..$PR_HEAD"
        else
          echo "::error title=POCP verify::no commit range: this ${EVENT_NAME:-} event isn't a pull request, so set the action's range input (for a push: the event's before..after shas)"
          exit 2
        fi
        args=(verify "$RANGE")
        [ "$RERUN" = "all" ] && args+=(--rerun)
        [ "$RERUN" = "unsigned" ] && args+=(--rerun-unsigned)
        [ -n "$CI_RESULTS" ] && args+=(--ci-results "$CI_RESULTS")
        [ -n "$ACCEPT_POLICY" ] && [ "$ACCEPT_POLICY" != "false" ] && args+=("--accept-policy-change=$ACCEPT_POLICY")
        [ -n "$ACCEPT_TESTS" ] && [ "$ACCEPT_TESTS" != "false" ] && args+=("--accept-test-change=$ACCEPT_TESTS")
        [ -n "$ACCEPT_INCONCLUSIVE" ] && [ "$ACCEPT_INCONCLUSIVE" != "false" ] && args+=("--accept-inconclusive=$ACCEPT_INCONCLUSIVE")
        [ -n "$ACCEPT_UNCOVERED" ] && [ "$ACCEPT_UNCOVERED" != "false" ] && args+=("--accept-uncovered=$ACCEPT_UNCOVERED")
        [ "$COVERAGE" = "true" ] && args+=(--require-coverage)
        case "$LABEL_FRESHNESS" in
          github) args+=(--label-freshness=github "--repo=$GITHUB_REPOSITORY" "--pull-request=$PR_NUMBER") ;;
          '')
            given=
            for v in "$ACCEPT_POLICY" "$ACCEPT_TESTS" "$ACCEPT_INCONCLUSIVE" "$ACCEPT_UNCOVERED"; do [ -n "$v" ] && [ "$v" != "false" ] && given=1; done
            if [ -n "$PR_NUMBER" ] && [ -n "$given" ]; then
              echo "::warning title=POCP approvals::this workflow predates POCP 1.3.1: approval labels aren't checked against the head, and the pocp-labels.yml that removed them runs on pull_request_target, which GitHub blocks by default in public repositories. Regenerate the workflows with: pocp init --github --force"
            fi ;;
          *) echo "::error title=POCP verify::label-freshness must be 'github' or empty, not '$LABEL_FRESHNESS'"; exit 2 ;;
        esac
        # Isolation fails closed: an unknown value is an error, not a quiet "false".
        case "$ISOLATE" in
          true) args+=(--isolate) ;;
          false) echo "::warning title=POCP isolation::isolate is false: the checks run as this job's own user (cooperative runner), not the secure profile" ;;
          *) echo "::error title=POCP verify::isolate must be 'true' or 'false', not '$ISOLATE'"; exit 2 ;;
        esac
        [ -n "$INSTALL" ] && args+=(--install "$INSTALL")
        # pocp-command is split into words, without globbing or any other shell expansion.
        cmd=()
        if [ -n "$POCP_CMD" ]; then read -r -a cmd <<< "$POCP_CMD"; fi
        # The approval file (read by the Approval file step below): only the bundled pocp, isolated.
        if [ "$ISOLATE" = "true" ] && [ "${#cmd[@]}" -eq 0 ]; then args+=("--approval-file=$APPROVAL_FILE"); fi
        # The record file (read by the Record file step below): the same conditions.
        if [ "$ISOLATE" = "true" ] && [ "${#cmd[@]}" -eq 0 ]; then args+=("--record-file=$RECORD_FILE"); fi
        run_verify() {
          if [ "${#cmd[@]}" -gt 0 ]; then "${cmd[@]}" "$@"
          else node "$GITHUB_ACTION_PATH/bin/pocp.js" "$@"; fi
        }
        if [ "$EXIT_DETAIL" = "true" ]; then
          # The step's outcome is verify's own exit status: the one result the checks it runs
          # can't write. The code output (which they could append to) only tells the workflow
          # which kind of not-verified this was.
          set +e
          run_verify "${args[@]}" --exit-detail
          code=$?
          set -e
          echo "code=$code" >> "${GITHUB_OUTPUT:-/dev/null}"
          exit "$code"
        else
          run_verify "${args[@]}"
        fi
    # What verify's approval file says: written by verify only when the checks ran isolated and
    # the wait is for approvals only, in the runner's temp folder, which isolated checks can't
    # reach. This step prints nothing of the pull request's, so nothing printed during the
    # Verify step can set its outputs.
    - name: Approval file
      id: mark
      if: always() && inputs.isolate == 'true'
      shell: bash
      env:
        APPROVAL_FILE: ${{ runner.temp }}/pocp-approvable
      run: |
        if [ -f "$APPROVAL_FILE" ]; then
          labels=$(head -n 1 "$APPROVAL_FILE")
          if printf '%s' "$labels" | grep -Eqx 'pocp-approve-[a-z]+(,pocp-approve-[a-z]+)*'; then
            { echo "approvable=true"; echo "needs=$labels"; } >> "$GITHUB_OUTPUT"
            # The test guard's verdict, one of four fixed words (an older verify writes none).
            verdict=$(grep -Ex 'verdict=(behavior-changed|detection-dropped|baseline-red|needs-review)' "$APPROVAL_FILE" | head -n 1 | cut -d= -f2 || true)
            if [ -n "$verdict" ]; then echo "verdict=$verdict" >> "$GITHUB_OUTPUT"; fi
          fi
        fi
    # What an approval of this head binds to (src/sticky-approval.js), from verify's record file:
    # same rules as the approval file above, each line checked against a fixed pattern.
    - name: Record file
      id: records
      if: always() && inputs.isolate == 'true'
      shell: bash
      env:
        RECORD_FILE: ${{ runner.temp }}/pocp-records
      run: |
        [ -f "$RECORD_FILE" ] || exit 0
        while IFS= read -r line; do
          if printf '%s' "$line" | grep -Eqx 'held tests [0-9a-f]{64}'; then
            echo "held_tests=${line#held tests }" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$line" | grep -Eqx 'approval pocp-approve-(tests|policy) (same|content|conflict|ci|policy|gone) [0-9a-f]{40}'; then
            rest=${line#approval pocp-approve-}
            echo "approval_${rest%% *}=${rest#* }" >> "$GITHUB_OUTPUT"
          fi
        done < "$RECORD_FILE"
